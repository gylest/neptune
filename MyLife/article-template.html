<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. UPDATE PAGE TITLE -->
    <title>Article Title - MyLife</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <!-- Import Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .nav-link-active {
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- =========== NAVIGATION BAR (Injected by layout.js) =========== -->
    <header id="main-header" class="bg-white shadow-md sticky top-0 z-50"></header>

    <!-- =========== MAIN CONTENT AREA =========== -->
    <!-- Breadcrumb and Prev/Next navigation are automatically injected by layout.js -->
    <main class="container mx-auto p-4 sm:p-6 lg:p-8">

        <div class="page-content">
            <section class="bg-white p-8 rounded-lg shadow-md">
                <article class="space-y-6">
                    <!-- 2. UPDATE ARTICLE HEADING & DATE -->
                    <header class="border-b border-gray-200 pb-4">
                        <h1 class="text-4xl font-bold text-gray-800 mb-2">Article Title Goes Here</h1>
                        <p class="text-sm text-gray-500">Posted on: Nov 1, 2026</p>
                    </header>

                    <!-- 3. OPTIONAL FEATURE IMAGE -->
                    <!-- Store category images in /images/pet/, /images/movie-reviews/, or /images/tech-articles/ -->
                    <!--
                    <div class="my-6">
                        <img src="/images/movie-reviews/your-image.jpg" alt="Article Image" class="w-full max-w-2xl rounded-lg shadow-md">
                    </div>
                    -->

                    <!-- 4. WRITE YOUR ARTICLE CONTENT HERE -->
                    <div class="space-y-4 text-gray-700 text-lg leading-relaxed">
                        <p>
                            Write your introduction paragraph here...
                        </p>

                        <h2 class="text-2xl font-semibold text-gray-800 pt-4">Section Heading</h2>
                        <p>
                            Add more details, thoughts, or code examples here...
                        </p>
                    </div>
                </article>
            </section>
        </div>

    </main>

    <!-- =========== FOOTER (Injected by layout.js) =========== -->
    <footer id="main-footer" class="bg-white mt-12 py-8 border-t border-gray-200"></footer>

    <!-- =========== JAVASCRIPT =========== -->
    <script src="/articles-data.js" defer></script>
    <script src="/layout.js" defer></script>

</body>
</html>
