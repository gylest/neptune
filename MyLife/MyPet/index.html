<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pet Stories</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <!-- Import Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Apply Inter font as the default */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Style for the active navigation link */
        .nav-link-active {
            color: #2563eb; /* text-blue-600 */
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- =========== NAVIGATION BAR =========== -->
    <header id="main-header" class="bg-white shadow-md sticky top-0 z-50"></header>

    <!-- =========== MAIN CONTENT AREA =========== -->
    <main class="container mx-auto p-4 sm:p-6 lg:p-8">

        <!-- =========== MY PET LISTING PAGE =========== -->
        <div id="page-pet-listing" class="page-content">
            <section class="bg-white p-8 rounded-lg shadow-md">
                <h1 class="text-4xl font-bold text-gray-800 mb-2">My Pet Stories &amp; Fun Facts</h1>
                <p class="text-lg text-gray-600 mb-8">Stories and fun facts about Ella, our Shih Tzu.</p>

                <!-- Grid of Pet Stories (Auto-populated from articles-data.js) -->
                <div id="category-articles-grid" data-category="pet" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Automatically populated by layout.js -->
                </div>
            </section>
        </div>

    </main>

    <!-- =========== FOOTER =========== -->
    <footer id="main-footer" class="bg-white mt-12 py-8 border-t border-gray-200"></footer>

    <!-- =========== JAVASCRIPT =========== -->
    <script src="/articles-data.js" defer></script>
    <script src="/layout.js" defer></script>

</body>
</html>
