<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <!-- Import Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Apply Inter font as the default */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Style for the active navigation link */
        .nav-link-active {
            color: #2563eb; /* text-blue-600 */
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- 
      =========== NAVIGATION BAR ===========
      This empty header will be filled by layout.js
    -->
    <header id="main-header" class="bg-white shadow-md sticky top-0 z-50">
        <!-- Content is injected by layout.js -->
    </header>

    <!-- =========== MAIN CONTENT AREA =========== -->
    <main class="container mx-auto p-4 sm:p-6 lg:p-8">

        <!-- =========== HOME PAGE =========== -->
        <div id="page-home" class="page-content">
            <!-- Welcome Section -->
            <section class="bg-white p-8 rounded-lg shadow-md text-center">
                <h1 class="text-4xl font-bold text-gray-800 mb-4">Welcome to My Personal Site!</h1>
                <p class="text-lg text-gray-600">
                    Hi, I'm <b>Tony Gyles</b>. This is my corner of the web where I share my passions.
                    You'll find thoughts on software, movies, my pet, and more.
                </p>
                <!-- Quick Category Navigation Pills -->
                <div class="mt-6 flex flex-wrap justify-center gap-3">
                    <a href="/MyPet/index.html" class="px-4 py-2 bg-blue-100 text-blue-800 rounded-full text-sm font-semibold hover:bg-blue-200 transition-colors">My Pet &amp; Fun Facts</a>
                    <a href="/MovieReviews/index.html" class="px-4 py-2 bg-red-100 text-red-800 rounded-full text-sm font-semibold hover:bg-red-200 transition-colors">Movie Reviews</a>
                    <a href="/MyArticle/index.html" class="px-4 py-2 bg-purple-100 text-purple-800 rounded-full text-sm font-semibold hover:bg-purple-200 transition-colors">Tech Articles</a>
                </div>
            </section>

            <!-- Recent Posts Section (Auto-populated from articles-data.js) -->
            <section class="mt-12">
                <h2 class="text-3xl font-bold text-gray-800 mb-6">Recent Posts</h2>
                <div id="home-recent-posts" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Automatically populated from articles-data.js by layout.js -->
                </div>
            </section>
        </div>

    </main>

    <!-- 
      =========== FOOTER ===========
      This empty footer will be filled by layout.js
    -->
    <footer id="main-footer" class="bg-white mt-12 py-8 border-t border-gray-200">
        <!-- Content is injected by layout.js -->
    </footer>

    <!-- 
      =========== JAVASCRIPT ===========
      Load articles-data.js first, then layout.js
    -->
    <script src="/articles-data.js" defer></script>
    <script src="/layout.js" defer></script>

</body>
</html>
